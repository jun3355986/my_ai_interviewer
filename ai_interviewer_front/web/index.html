<body>
  <script>
    // Local debugging only: clear stale Flutter service workers/caches that can keep old bundles.
    (function () {
      var isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
      if (!isLocalhost) {
        return;
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister();
          });
        }).catch(function () {
          // no-op
        });
      }

      if ("caches" in window && typeof window.caches.keys === "function") {
        window.caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (key) {
            return window.caches.delete(key);
          }));
        }).catch(function () {
          // no-op
        });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var maxAttempts = 8;
      var attempts = 0;
      var retryDelayMs = 1500;
      var startDelayMs = 10000;

      function wrapDartRunMainOnce() {
        if (window.__dartRunMainWrapped || typeof window.$dartRunMain !== "function") {
          return;
        }

        var original = window.$dartRunMain;
        window.$dartRunMain = function () {
          if (window.__dartMainStarted) {
            return;
          }
          window.__dartMainStarted = true;
          return original.apply(this, arguments);
        };
        window.__dartRunMainWrapped = true;
      }

      function hasVisibleFlutterSurface() {
        var surface = document.querySelector("flutter-view, flt-glass-pane, flt-scene-host, canvas");
        if (!surface) {
          return false;
        }

        var rect = surface.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0;
      }

      function ensureDartMainStarted() {
        wrapDartRunMainOnce();
        attempts += 1;

        if (hasVisibleFlutterSurface() || window.__dartMainStarted) {
          return;
        }

        if (typeof window.$dartRunMain === "function") {
          try {
            window.$dartRunMain();
            return;
          } catch (_) {
          }
        }

        if (attempts < maxAttempts) {
          window.setTimeout(ensureDartMainStarted, retryDelayMs);
        }
      }

      window.addEventListener("load", function () {
        window.setTimeout(ensureDartMainStarted, startDelayMs);
      });
    })();
  </script>
</body>
</html>
