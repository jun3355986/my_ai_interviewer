server:
  port: 9003
  forward-headers-strategy: framework

spring:
  application:
    name: ai-interviewer-interview
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:nacos:ai-interviewer-interview.yaml

  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ai_interviewer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: InterviewHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Interview domain migrations use a dedicated history table because Admin owns flyway_schema_history.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_interview_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aiinterviewer.interview.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: now()
      logic-not-delete-value: 'null'
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Python AI服务配置
python:
  ai:
    base-url: ${PYTHON_AI_BASE_URL:http://localhost:8000}
    timeout:
      connect: 5000      # 连接超时 5秒
      read: 600000       # 读取超时 10分钟 (SSE需要长时间)
      write: 30000       # 写入超时 30秒

interview:
  turn-attempt:
    stale-after: ${TURN_ATTEMPT_STALE_AFTER:PT15M}
    recovery-initial-delay: ${TURN_ATTEMPT_RECOVERY_INITIAL_DELAY:PT0S}
    recovery-interval: ${TURN_ATTEMPT_RECOVERY_INTERVAL:PT1M}
    executor:
      core-size: ${TURN_ATTEMPT_EXECUTOR_CORE_SIZE:2}
      max-size: ${TURN_ATTEMPT_EXECUTOR_MAX_SIZE:4}
      queue-capacity: ${TURN_ATTEMPT_EXECUTOR_QUEUE_CAPACITY:100}

# 日志配置
logging:
  level:
    root: INFO
    com.aiinterviewer: DEBUG
    org.springframework.web.reactive: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  use-forwarded-headers: true
