services:
  # ============================================
  # 基础设施服务
  # ============================================
  nacos:
    image: nacos/nacos-server:v2.3.0
    platform: linux/amd64
    container_name: ai-interviewer-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 1024m
      JVM_XMX: 1024m
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - ai-interviewer-net
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 8

  postgres:
    image: postgres:16-alpine
    container_name: ai-interviewer-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interviewer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ai-interviewer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: ai-interviewer-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - ai-interviewer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  minio:
    image: minio/minio:latest
    container_name: ai-interviewer-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai-interviewer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  # ============================================
  # Python AI 服务
  # ============================================
  python-ai:
    image: ai-interviewer-python-ai:local
    container_name: ai-interviewer-python-ai
    mem_limit: 1500m
    build:
      context: ../ai_interviewer
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AI_OPENAI_COMPAT_API_KEY: ${OPENCODE_GO_API_KEY:-test-key}
      AI_OPENAI_COMPAT_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1/}
      AI_OPENAI_COMPAT_CHAT_MODEL: ${OPENCODE_GO_CHAT_MODEL:-deepseek-v4-flash}
      AI_OPENAI_COMPAT_FALLBACK_CHAT_MODELS: ${OPENCODE_GO_FALLBACK_CHAT_MODELS:-mimo-v2.5,mimo-v2.5-pro}
      # OpenCode Go 只提供聊天模型。embedding 使用火山方舟 Agent Plan 的专属
      # Base URL 和专属 Key；缺少有效 Key 时，技术题检索安全退化为关键词检索。
      # 不要把 Agent Plan Key 换成普通方舟/Coding Plan Key，也不要把 /api/plan/v3
      # 改成 /api/v3，否则可能认证失败或产生计划外费用。
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-test-key}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://ark.cn-beijing.volces.com/api/plan/v3}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-doubao-embedding-vision}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1024}
      # 历史 interview_questions 中是旧模型生成的 615 条向量。新模型必须迁入独立
      # Collection，不能仅因维度同为 1024 就混用两个不同语义空间的向量。
      AI_INTERVIEW_VECTOR_COLLECTION: ${AI_INTERVIEW_VECTOR_COLLECTION:-interview_questions_doubao_embedding_vision_251215_1024_v1}
      # Day 3 local trace evidence. Keep raw prompt/response storage opt-in because
      # interview content may contain candidate PII; aggregate usage and latency remain available.
      AI_OBSERVABILITY_ENABLED: ${AI_OBSERVABILITY_ENABLED:-true}
      AI_OBSERVABILITY_DB_URL: ${AI_OBSERVABILITY_DB_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/ai_interviewer}
      AI_OBSERVABILITY_STORE_RAW_PAYLOAD: ${AI_OBSERVABILITY_STORE_RAW_PAYLOAD:-false}
    volumes:
      - ../ai_interviewer/storage:/app/storage
    networks:
      - ai-interviewer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================
  # Java 微服务
  # 使用同一个镜像，按 APP_MODULE 启动不同服务
  # ============================================
  gateway:
    image: ai-interviewer-backend-app:local
    container_name: ai-interviewer-gateway
    mem_limit: 700m
    build:
      context: .
      dockerfile: docker/java-services.Dockerfile
    ports:
      - "9000:9000"
    environment:
      APP_MODULE: ai-interviewer-gateway
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-for-jwt-signing-must-be-at-least-32-characters}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:InitialRAMPercentage=12 -XX:MaxRAMPercentage=55}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      user:
        condition: service_started
      job:
        condition: service_started
      resume:
        condition: service_started
      interview:
        condition: service_started
      admin:
        condition: service_healthy
      evaluation:
        condition: service_started
      notification:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  user:
    image: ai-interviewer-backend-app:local
    container_name: ai-interviewer-user
    mem_limit: 900m
    build:
      context: .
      dockerfile: docker/java-services.Dockerfile
    ports:
      - "9001:9001"
    environment:
      APP_MODULE: ai-interviewer-user
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_interviewer
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-for-jwt-signing-must-be-at-least-32-characters}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:InitialRAMPercentage=12 -XX:MaxRAMPercentage=55}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped

  resume:
    image: ai-interviewer-backend-app:local
    container_name: ai-interviewer-resume
    mem_limit: 900m
    build:
      context: .
      dockerfile: docker/java-services.Dockerfile
    ports:
      - "9002:9002"
    environment:
      APP_MODULE: ai-interviewer-resume
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_interviewer
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_AI_BASE_URL: http://python-ai:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-interviewer}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:InitialRAMPercentage=12 -XX:MaxRAMPercentage=55}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped

  interview:
    image: ai-interviewer-backend-app:local
    container_name: ai-interviewer-interview
    mem_limit: 1000m
    build:
      context: .
      dockerfile: docker/java-services.Dockerfile
    expose:
      - "9003"
    environment:
      APP_MODULE: ai-interviewer-interview
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_interviewer
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_AI_BASE_URL: http://python-ai:8000
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:InitialRAMPercentage=12 -XX:MaxRAMPercentage=55}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped

  job:
    image: ai-interviewer-backend-app:local
    container_name: ai-interviewer-job
    mem_limit: 900m
    build:
      context: .
      dockerfile: docker/java-services.Dockerfile
    ports:
      - "9004:9004"
    environment:
      APP_MODULE: ai-interviewer-job
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_interviewer
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:InitialRAMPercentage=12 -XX:MaxRAMPercentage=55}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped

  evaluation:
    image: ai-interviewer-backend-app:local
    container_name: ai-interviewer-evaluation
    mem_limit: 900m
    build:
      context: .
      dockerfile: docker/java-services.Dockerfile
    expose:
      - "9005"
    environment:
      APP_MODULE: ai-interviewer-evaluation
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_interviewer
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:InitialRAMPercentage=12 -XX:MaxRAMPercentage=55}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped

  # ============================================
  # Admin 后台服务
  # 独立 Maven 项目，不属于 ai_interview_backend 多模块
  # ============================================
  admin:
    image: ai-interviewer-admin:local
    container_name: ai-interviewer-admin
    mem_limit: 900m
    build:
      context: ../ai_interviewer_admin
      dockerfile: Dockerfile
    ports:
      - "9010:9010"
    environment:
      SERVER_PORT: 9010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_interviewer
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_ENABLED: "true"
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-ai-interviewer-admin-local-secret-change-me-please}
      PYTHON_AI_QUESTION_BANK_SYNC_URL: http://python-ai:8000/admin/question-bank/sync
      PYTHON_AI_QUESTION_BANK_DELETE_URL: http://python-ai:8000/admin/question-bank/delete
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:InitialRAMPercentage=12 -XX:MaxRAMPercentage=55}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Notification HTTP API 默认启动；RocketMQ 消费器默认关闭。
  # 如需启用消息消费，请提供可用 RocketMQ 并设置 NOTIFICATION_ROCKETMQ_ENABLED=true。
  notification:
    image: ai-interviewer-backend-app:local
    container_name: ai-interviewer-notification
    mem_limit: 900m
    build:
      context: .
      dockerfile: docker/java-services.Dockerfile
    ports:
      - "9006:9006"
    environment:
      APP_MODULE: ai-interviewer-notification
      NACOS_SERVER_ADDR: nacos:8848
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_interviewer
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROCKETMQ_NAMESRV_ADDR: ${ROCKETMQ_NAMESRV_ADDR:-rocketmq-namesrv:9876}
      NOTIFICATION_ROCKETMQ_ENABLED: ${NOTIFICATION_ROCKETMQ_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:InitialRAMPercentage=12 -XX:MaxRAMPercentage=55}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9006/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================
  # Flutter Web 前端
  # 统一通过 gateway 转发后端 API
  # ============================================
  frontend:
    image: ai-interviewer-frontend:local
    container_name: ai-interviewer-frontend
    build:
      context: ../ai_interviewer_front
      dockerfile: Dockerfile
      args:
        GATEWAY_BASE_URL: ${FRONTEND_GATEWAY_BASE_URL:-/}
    ports:
      - "8088:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # React Admin Web 后台页面
  # /admin/* 由 Nginx 反向代理到 gateway
  # ============================================
  admin-web:
    image: ai-interviewer-admin-web:local
    container_name: ai-interviewer-admin-web
    build:
      context: ../ai_interviewer_admin_front
      dockerfile: Dockerfile
      args:
        ADMIN_API_BASE: ${ADMIN_WEB_API_BASE:-/admin}
    ports:
      - "8090:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - ai-interviewer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ai-interviewer-net:
    driver: bridge

volumes:
  nacos_data:
  postgres_data:
  redis_data:
  minio_data:
